<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3878ed">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("indiantrader-theme")||"light"}catch(e){document.documentElement.dataset.theme="light"}</script>
<title>Paper Trader</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/access.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/dashboard" aria-label="Paper Trader home">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="12" width="4" height="8" rx="1" fill="currentColor" opacity=".55"/><rect x="10" y="6" width="4" height="14" rx="1" fill="currentColor"/><rect x="17" y="9" width="4" height="11" rx="1" fill="currentColor" opacity=".8"/></svg>
    <span>Paper Trader<small>NSE practice terminal</small></span>
  </a>

  <nav class="mainnav" aria-label="Main">
    <a href="#/dashboard" data-nav="dashboard">Dashboard</a>
    <a href="#/scanner" data-nav="scanner">Scanner</a>
    <a href="#/positions" data-nav="positions">Positions</a>
    <a href="#/orders" data-nav="orders">Orders</a>
    <a href="#/journal" data-nav="journal">Journal</a>
    <a href="#/settings" data-nav="settings">Settings</a>
  </nav>
  <div class="header-tools"><div class="account-actions"><a href="/start.html">Switch mode</a><button id="logout" type="button">Log out</button></div><span class="practice-badge">PAPER ACCOUNT</span><div class="account-chip" id="account-chip"></div><button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme"></button></div>
</header>

<div class="marketbar"><div class="indices" id="market-pill"></div><span class="marketbar-note">Practice with purpose. Trade with a plan.</span></div>
<div class="notice" id="notice" hidden></div>

<div class="layout">
  <aside class="watchlist" id="watchlist" aria-label="Watchlist">
    <div class="watchlist-title"><span>Marketwatch</span><span class="exchange-label">NSE</span></div>
    <div class="wl-search">
      <input id="search" type="search" placeholder="Search stocks, e.g. INFY" autocomplete="off" aria-label="Search stocks">
      <div class="wl-results" id="search-results" hidden></div>
    </div>
    <div class="wl-head"><span id="wl-count">Watchlist</span><span class="muted" id="wl-src"></span></div>
    <ul class="wl-list" id="wl-list"></ul>
    <div class="watchlist-footer"><span class="footer-icon">◇</span><div><b>A space to learn</b><span>Simulated trades. Real experience.</span></div></div>
  </aside>
  <main class="content" id="view" tabindex="-1"></main>
</div>

<nav class="bottomnav" aria-label="Main (mobile)">
  <a href="#/watchlist" data-nav="watchlist">Watchlist</a>
  <a href="#/dashboard" data-nav="dashboard">Home</a>
  <a href="#/scanner" data-nav="scanner">Scanner</a>
  <a href="#/positions" data-nav="positions">Positions</a>
  <a href="#/settings" data-nav="settings">Settings</a>
</nav>

<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<section class="sheet" id="order-sheet" role="dialog" aria-modal="true" aria-labelledby="order-title" hidden></section>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/ui.js"></script>
</body>
</html>
