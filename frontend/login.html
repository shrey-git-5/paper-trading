<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in · IndianTrader</title><meta name="referrer" content="no-referrer"><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/access.css"><script>try{document.documentElement.dataset.theme=localStorage.getItem('indiantrader-theme')||'light'}catch{}</script></head><body class="access-page"><header class="access-header"><a class="access-brand" href="/start.html"><span class="access-mark">↗</span>IndianTrader</a><a href="/start.html">← Change mode</a></header><main class="auth-main"><section class="auth-card panel"><p class="eyebrow" id="mode-label">YOUR PRACTICE ACCOUNT</p><h1 id="auth-title">Welcome back</h1><p id="auth-description" class="lead">Log in to continue your practice.</p><div class="auth-tabs" id="auth-tabs"><button type="button" data-tab="login" class="on">Log in</button><button type="button" data-tab="signup">Create account</button></div><p class="setup-notice" id="setup-notice" hidden>Connect the owner's Gmail to enable signup and recovery emails. <a href="/setup.html">Open Gmail setup →</a></p><form id="login-form"><div class="field" id="name-field" hidden><label for="name">Your name</label><input id="name" maxlength="80" autocomplete="name"></div><div class="field"><label for="email">Email address</label><input id="email" type="email" autocomplete="username" maxlength="254" required></div><div class="field" id="password-field"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" maxlength="128" required><small id="password-hint" hidden>Use 12–128 characters.</small></div><div class="field" id="confirm-field" hidden><label for="confirm">Confirm password</label><input id="confirm" type="password" autocomplete="new-password" maxlength="128"></div><button class="btn buy wide" id="auth-submit" type="submit">Log in</button><button class="linklike recover-link" id="forgot" type="button">Forgot password?</button><button class="linklike recover-link" id="cancel-recovery" type="button" hidden>Back to login</button></form><form id="code-form" hidden><div class="field"><label for="otp">Six-digit email code</label><input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><div id="new-password-fields" hidden><div class="field"><label for="new-pw">New password</label><input id="new-pw" type="password" autocomplete="new-password" minlength="12" maxlength="128"></div><div class="field"><label for="new-confirm">Confirm new password</label><input id="new-confirm" type="password" autocomplete="new-password" maxlength="128"></div></div><button class="btn buy wide" type="submit">Verify code</button><div class="code-actions"><button class="linklike" type="button" id="resend">Resend code</button><button class="linklike" type="button" id="back-login">Back to login</button></div></form><p class="auth-message" id="auth-message" role="status" aria-live="polite"></p><p class="access-note">Demo and Paper Trading share one login.<br>All trades use virtual money.</p></section></main><script type="module" src="js/login.js"></script></body></html>
